name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Build with Gradle
      run: |
        curl -LO https://gradle.org
        unzip -q gradle-2.7-bin.zip
        export PATH=$PWD/gradle-2.7/bin:$PATH
        gradle setupDecompWorkspace build
    - name: Upload Mod Jar
      uses: actions/upload-artifact@v3
      with:
        name: CPSCounter-Jar
        path: build/libs/*.jar
